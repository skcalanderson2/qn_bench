name: Build Windows Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build and attach Windows assets to (e.g. v2.0.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Determine release tag
        id: meta
        shell: pwsh
        run: |
          $tag = "${{ inputs.tag || github.event.release.tag_name }}"
          if (-not $tag) {
            Write-Error "No release tag provided."
            exit 1
          }
          $ver = $tag.TrimStart("v", "V")
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "version=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          Write-Host "Building Rust Windows x64 release for $tag (version $ver)"

      - name: Checkout repository at release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.meta.outputs.tag }}

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2

      - name: Generate procedural Windows icon (.ico)
        shell: pwsh
        run: cargo run --release --bin gen_icons -- --ico

      - name: Build Rust Windows binary (x64)
        shell: pwsh
        run: |
          cargo build --release --bin qn_bench
          New-Item -ItemType Directory -Force -Path "dist\QN Bench" | Out-Null
          Copy-Item "target\release\qn_bench.exe" "dist\QN Bench\QN Bench.exe" -Force
          if (-not (Test-Path "dist\QN Bench\QN Bench.exe")) {
            Write-Error "Expected dist\QN Bench\QN Bench.exe was not generated."
            exit 1
          }

      - name: Create portable ZIP (for direct download and self-updater)
        shell: pwsh
        run: |
          $zipPath = "dist\QN-Bench-windows-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "dist\QN Bench" -DestinationPath $zipPath -Force

      - name: Build Windows Installer (.exe) with Inno Setup
        shell: pwsh
        run: |
          $iscc = Get-Command iscc -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source
          if (-not $iscc) {
            $fallback = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
            if (Test-Path $fallback) { $iscc = $fallback }
          }
          if (-not $iscc) {
            Write-Error "Inno Setup compiler (ISCC.exe) not found on runner."
            exit 1
          }
          & $iscc "/DAppVersion=${{ steps.meta.outputs.version }}" installer_win.iss

      - name: Generate SHA256SUMS-windows.txt
        shell: pwsh
        run: |
          $ver = "${{ steps.meta.outputs.version }}"
          $setupName = "QN-Bench-$ver-windows-x64-setup.exe"
          $zipName = "QN-Bench-windows-x64.zip"
          $lines = @()
          foreach ($name in @($setupName, $zipName)) {
            $hash = (Get-FileHash -Path "dist\$name" -Algorithm SHA256).Hash.ToLowerInvariant()
            $lines += "$hash  $name"
          }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllLines("$PWD\dist\SHA256SUMS-windows.txt", $lines, $utf8NoBom)
          Get-Content "dist\SHA256SUMS-windows.txt"

      - name: Upload Windows assets to GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ steps.meta.outputs.tag }}"
          $ver = "${{ steps.meta.outputs.version }}"
          gh release upload $tag `
            "dist\QN-Bench-$ver-windows-x64-setup.exe" `
            "dist\QN-Bench-windows-x64.zip" `
            "dist\SHA256SUMS-windows.txt" `
            --clobber
