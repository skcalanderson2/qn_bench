<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>QN Bench — Quantum Networking Optical Bench (Web)</title>
  <link data-trunk rel="rust" href="../Cargo.toml" data-bin="qn_bench" data-wasm-opt="0" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
      background: #0c1017;
      color: #eef4fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      background: #0c1017;
      z-index: 10;
      text-align: center;
      padding: 1.5rem;
    }
    .loader-box {
      max-width: 420px;
      padding: 1.5rem 2rem;
      border-radius: 12px;
      border: 1px solid #33445e;
      background: #141b27;
    }
    .loader-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: #56ccf2;
      margin: 0 0 0.5rem;
    }
    .loader-sub {
      margin: 0;
      font-size: 0.92rem;
      color: #b4c4da;
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="loader-box">
      <p class="loader-title">QN Bench</p>
      <p class="loader-sub">Initializing 1550nm Quantum Networking Optical Bench (WebAssembly)…</p>
    </div>
  </div>
  <canvas id="qn_bench_canvas"></canvas>
</body>
</html>
